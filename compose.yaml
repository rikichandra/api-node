services:
  api:
    build: .
    init: true
    restart: unless-stopped
    environment:
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env before starting}
      HOST: 0.0.0.0
      PORT: 3108
      DATA_DIR: /app/storage
      SCRAPER_BROWSER: chromium
      WORKERS: ${WORKERS:-1}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    ports:
      - "127.0.0.1:3108:3108"
    volumes:
      - jobs:/app/storage
    security_opt:
      - seccomp=./deploy/seccomp_profile.json
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3108/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  jobs:
